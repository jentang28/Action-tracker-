<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Track agreed meeting actions by owner, tick them off, and spot overdue items at a glance.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D9691E'/%3E%3Cpath d='M9 16.5l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Meeting Action Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one narrow column — header, summary strip, add form, then one card per owner in a responsive grid */
:root {
  --bg: #F3F4F2;
  --surface: #FFFFFF;
  --surface-2: #EBEDEA;
  --line: #D9DCD7;
  --fg: #2B2F2E;
  --muted: #6B716E;
  --accent: #D9691E;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE9DC;
  --danger: #C23B32;
  --danger-soft: #FBE7E5;
  --done: #8C928F;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1E1D; --surface: #242827; --surface-2: #2D3230; --line: #3A403E;
    --fg: #E8EAE8; --muted: #A0A6A3; --accent: #F0883E; --accent-ink: #1B1E1D;
    --accent-soft: #3A2B20; --danger: #F07167; --danger-soft: #3B2422; --done: #7D8380;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1E1D; --surface: #242827; --surface-2: #2D3230; --line: #3A403E;
  --fg: #E8EAE8; --muted: #A0A6A3; --accent: #F0883E; --accent-ink: #1B1E1D;
  --accent-soft: #3A2B20; --danger: #F07167; --danger-soft: #3B2422; --done: #7D8380;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 1rem; }
.today { color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat .label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat .num { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.open .num { color: var(--accent); }
.stat.overdue .num { color: var(--danger); }
.stat.overdue.zero .num { color: var(--muted); }
.stat .note { font-size: 0.9rem; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }

/* Add form */
.add { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
.add h2 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; margin: 0; }
.fields { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 0.85rem; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }
input[type="text"], input[type="date"] {
  font: inherit; font-size: 1.05rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-height: 50px;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-primary {
  font: inherit; font-weight: 700; font-size: 1.05rem; background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 10px; padding: 0 22px; min-height: 50px; cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.06); }
.form-msg { margin: 0; color: var(--danger); font-size: 0.95rem; min-height: 1.4em; }

/* Example banner */
.examples { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 0.95rem; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-primary:disabled { opacity: .6; cursor: wait; }
.link-btn { font: inherit; font-weight: 700; color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; background: var(--surface); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.toolbar h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 4px; gap: 4px; }
.seg button { font: inherit; font-size: 0.95rem; border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; }

/* Owner cards */
.owners { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; align-items: start; }
.owner { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.owner-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--surface-2); color: var(--fg); display: grid; place-items: center; font-weight: 700; font-size: 1rem; }
.owner-name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.owner-meta { margin-left: auto; text-align: right; font-size: 0.9rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.owner-meta b { color: var(--danger); }

ul.actions { list-style: none; margin: 0; padding: 0; }
li.action { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 14px 18px; border-bottom: 1px solid var(--line); }
li.action:last-child { border-bottom: 0; }
li.action.overdue { background: var(--danger-soft); }
.tick { appearance: none; width: 28px; height: 28px; margin: 2px 0 0; border: 2px solid var(--muted); border-radius: 7px; cursor: pointer; display: grid; place-items: center; background: var(--surface); }
.tick:checked { background: var(--done); border-color: var(--done); }
.tick:checked::after { content: ""; width: 8px; height: 14px; border: solid var(--surface); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.tick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.a-text { min-width: 0; }
.a-title { margin: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
.a-due { margin: 2px 0 0; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; }
.pill.red { background: var(--danger); color: var(--surface); }
.pill.soon { background: var(--accent-soft); color: var(--fg); }
.pill.ex { background: var(--surface-2); color: var(--muted); }
li.action.overdue .a-title, li.action.overdue .a-due { color: var(--danger); font-weight: 700; }
li.action.done .a-title { color: var(--done); text-decoration: line-through; }
li.action.done .a-due { color: var(--done); }
.del { font: inherit; font-size: 0.9rem; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.del:hover { color: var(--danger); background: var(--surface-2); }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 32px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 1.15rem; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 10px; display: flex; gap: 14px; align-items: center; font-size: 1rem; max-width: calc(100% - 32px); }
.toast button { font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; cursor: pointer; }
.storage-warn { color: var(--danger); font-size: 0.95rem; margin: 0; }

@media (max-width: 760px) {
  .fields { grid-template-columns: 1fr 1fr; }
  .fields .f-title { grid-column: 1 / -1; }
  .fields .btn-primary { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  body { font-size: 17px; }
  .summary { gap: 8px; }
  .stat { padding: 12px; }
  .stat .num { font-size: 1.9rem; }
  .stat .note { display: none; }
  .fields { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Meeting <span>actions</span></h1>
      <p class="sub">What we agreed, who owns it, and when it's due.</p>
    </div>
    <div class="today" id="today"></div>
  </header>

  <p class="storage-warn" id="status" role="alert" hidden></p>

  <section class="summary" aria-label="Summary">
    <div class="stat open"><div class="label">Open</div><div class="num" id="nOpen">0</div><div class="note">still to do</div></div>
    <div class="stat done"><div class="label">Done</div><div class="num" id="nDone">0</div><div class="bar" aria-hidden="true"><i id="doneBar"></i></div></div>
    <div class="stat overdue" id="statOverdue"><div class="label">Overdue</div><div class="num" id="nOverdue">0</div><div class="note">past due date</div></div>
  </section>

  <form class="add" id="addForm" novalidate>
    <h2>Add an action</h2>
    <div class="fields">
      <div class="field f-title">
        <label for="fTitle">Action</label>
        <input type="text" id="fTitle" placeholder="e.g. Send revised budget to finance" autocomplete="off">
      </div>
      <div class="field">
        <label for="fOwner">Owner</label>
        <input type="text" id="fOwner" list="ownerList" placeholder="Name" autocomplete="off">
        <datalist id="ownerList"></datalist>
      </div>
      <div class="field">
        <label for="fDue">Due date</label>
        <input type="date" id="fDue">
      </div>
      <button type="submit" class="btn-primary" id="addBtn">Add action</button>
    </div>
    <p class="form-msg" id="formMsg" role="alert"></p>
  </form>

  <div class="examples" id="exBanner" hidden>
    <span>These are example actions to show how the tracker works.</span>
    <button type="button" class="link-btn" id="clearEx">Remove examples</button>
  </div>

  <section>
    <div class="toolbar">
      <h2>By owner</h2>
      <div class="tools">
      <button type="button" class="link-btn" id="refreshBtn">Refresh</button>
      <div class="seg" role="group" aria-label="Filter">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="open" aria-pressed="false">Open</button>
        <button type="button" data-filter="overdue" aria-pressed="false">Overdue</button>
      </div>
      </div>
    </div>
  </section>

  <div class="owners" id="owners"></div>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="undoBtn">Undo</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://htvpljrhdgsicivvvqzd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_f__-k8p5YEUnz2dNBD0BmQ_k56Pmnw7";
  const FKEY = "meeting-action-tracker-filter";
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const $ = id => document.getElementById(id);

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmt(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return d + " " + MONTHS[m - 1] + " " + y;
  }
  function daysBetween(a, b) {
    const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
  }

  let db = null;
  try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { db = null; }

  let actions = [];
  let loaded = false;
  let T = todayISO();

  function setStatus(msg) {
    $("status").textContent = msg || "";
    $("status").hidden = !msg;
  }

  function fromRow(r) {
    return { id: r.id, title: r.title, owner: r.owner, due: r.due, done: r.done, example: r.is_example };
  }

  async function fetchAll() {
    if (!db) { setStatus("Couldn't load the database library. Check your internet connection and reload the page."); return; }
    const { data, error } = await db.from("actions").select("*").order("due", { ascending: true });
    if (error) { setStatus("Couldn't load actions: " + error.message + ". Reload the page to try again."); return; }
    actions = data.map(fromRow);
    loaded = true;
    setStatus("");
    render();
  }

  async function run(op, failMsg) {
    const { error } = await op;
    if (error) { setStatus(failMsg + " " + error.message); await fetchAll(); return false; }
    return true;
  }

  let filter = "all";
  try { filter = localStorage.getItem(FKEY) || "all"; } catch (e) {}

  function isOverdue(a) { return !a.done && a.due < T; }

  function render() {
    T = todayISO();
    $("today").textContent = "Today: " + fmt(T);

    const open = actions.filter(a => !a.done).length;
    const done = actions.length - open;
    const overdue = actions.filter(isOverdue).length;
    $("nOpen").textContent = open;
    $("nDone").textContent = done;
    $("nOverdue").textContent = overdue;
    $("statOverdue").classList.toggle("zero", overdue === 0);
    $("doneBar").style.width = actions.length ? (done / actions.length * 100) + "%" : "0";

    $("exBanner").hidden = !actions.some(a => a.example);

    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === filter)));

    const names = [...new Set(actions.map(a => a.owner.trim()))].sort((a, b) => a.localeCompare(b));
    $("ownerList").innerHTML = "";
    names.forEach(n => { const o = document.createElement("option"); o.value = n; $("ownerList").appendChild(o); });

    const host = $("owners");
    host.innerHTML = "";

    if (!loaded) {
      const e = document.createElement("div");
      e.className = "empty"; e.style.gridColumn = "1 / -1";
      e.innerHTML = "<strong>Loading actions…</strong>Fetching the team's list.";
      host.appendChild(e);
      return;
    }

    const shown = actions.filter(a => filter === "all" ? true : filter === "open" ? !a.done : isOverdue(a));
    const groups = new Map();
    shown.forEach(a => {
      const k = a.owner.trim().toLowerCase();
      if (!groups.has(k)) groups.set(k, { name: a.owner.trim(), items: [] });
      groups.get(k).items.push(a);
    });

    if (groups.size === 0) {
      const e = document.createElement("div");
      e.className = "empty"; e.style.gridColumn = "1 / -1";
      if (!actions.length) e.innerHTML = "<strong>No actions yet</strong>Add the first action from your meeting using the form above.";
      else if (filter === "overdue") e.innerHTML = "<strong>Nothing overdue</strong>Every open action is still within its due date.";
      else e.innerHTML = "<strong>All done</strong>There are no open actions right now.";
      host.appendChild(e);
      return;
    }

    const sorted = [...groups.values()].sort((g1, g2) => {
      const o1 = g1.items.filter(isOverdue).length, o2 = g2.items.filter(isOverdue).length;
      if (o1 !== o2) return o2 - o1;
      const p1 = g1.items.filter(a => !a.done).length, p2 = g2.items.filter(a => !a.done).length;
      if (p1 !== p2) return p2 - p1;
      return g1.name.localeCompare(g2.name);
    });

    sorted.forEach(g => {
      g.items.sort((a, b) => (a.done - b.done) || a.due.localeCompare(b.due));
      const openN = g.items.filter(a => !a.done).length;
      const overN = g.items.filter(isOverdue).length;

      const card = document.createElement("article");
      card.className = "owner";
      const head = document.createElement("div");
      head.className = "owner-head";
      const av = document.createElement("div");
      av.className = "avatar"; av.setAttribute("aria-hidden", "true");
      av.textContent = g.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
      const h = document.createElement("h3");
      h.className = "owner-name"; h.textContent = g.name;
      const meta = document.createElement("div");
      meta.className = "owner-meta";
      meta.innerHTML = openN + " open" + (overN ? " · <b>" + overN + " overdue</b>" : "");
      head.append(av, h, meta);

      const ul = document.createElement("ul");
      ul.className = "actions";
      g.items.forEach(a => {
        const li = document.createElement("li");
        li.className = "action" + (a.done ? " done" : "") + (isOverdue(a) ? " overdue" : "");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.className = "tick"; cb.checked = a.done; cb.id = "cb-" + a.id;
        cb.setAttribute("aria-label", "Mark done: " + a.title);
        cb.addEventListener("change", async () => {
          a.done = cb.checked; render();
          await run(db.from("actions").update({ done: a.done }).eq("id", a.id), "Couldn't save that change.");
        });

        const txt = document.createElement("div"); txt.className = "a-text";
        const t = document.createElement("label"); t.className = "a-title"; t.htmlFor = cb.id; t.textContent = a.title; t.style.display = "block"; t.style.cursor = "pointer";
        const due = document.createElement("p"); due.className = "a-due";
        const dspan = document.createElement("span"); dspan.textContent = "Due " + fmt(a.due); due.appendChild(dspan);
        if (!a.done) {
          const diff = daysBetween(T, a.due);
          let pill = null;
          if (diff < 0) { pill = document.createElement("span"); pill.className = "pill red"; pill.textContent = "Overdue " + (-diff) + (diff === -1 ? " day" : " days"); }
          else if (diff === 0) { pill = document.createElement("span"); pill.className = "pill soon"; pill.textContent = "Due today"; }
          else if (diff <= 2) { pill = document.createElement("span"); pill.className = "pill soon"; pill.textContent = diff === 1 ? "Tomorrow" : "In 2 days"; }
          if (pill) due.appendChild(pill);
        }
        if (a.example) { const ex = document.createElement("span"); ex.className = "pill ex"; ex.textContent = "Example"; due.appendChild(ex); }
        txt.append(t, due);

        const del = document.createElement("button");
        del.type = "button"; del.className = "del"; del.textContent = "Delete";
        del.setAttribute("aria-label", "Delete: " + a.title);
        del.addEventListener("click", () => removeAction(a.id));

        li.append(cb, txt, del);
        ul.appendChild(li);
      });

      card.append(head, ul);
      host.appendChild(card);
    });
  }

  // Delete with undo: re-inserts the same row (same id) if Undo is pressed
  let lastDeleted = null, toastTimer = null;
  async function removeAction(id) {
    const idx = actions.findIndex(a => a.id === id);
    if (idx < 0) return;
    lastDeleted = actions[idx];
    actions.splice(idx, 1);
    render();
    showToast("Action deleted");
    await run(db.from("actions").delete().eq("id", id), "Couldn't delete that action.");
  }
  function showToast(msg) {
    $("toastMsg").textContent = msg;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; lastDeleted = null; }, 6000);
  }
  $("undoBtn").addEventListener("click", async () => {
    $("toast").hidden = true;
    if (!lastDeleted) return;
    const a = lastDeleted; lastDeleted = null;
    const ok = await run(db.from("actions").insert({ id: a.id, title: a.title, owner: a.owner, due: a.due, done: a.done, is_example: !!a.example }), "Couldn't restore that action.");
    if (ok) await fetchAll();
  });

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const title = $("fTitle").value.trim();
    const owner = $("fOwner").value.trim();
    const due = $("fDue").value;
    const missing = [];
    if (!title) missing.push("the action");
    if (!owner) missing.push("an owner");
    if (!due) missing.push("a due date");
    if (missing.length) {
      $("formMsg").textContent = "Please add " + missing.join(", ").replace(/, ([^,]*)$/, " and $1") + ".";
      (!title ? $("fTitle") : !owner ? $("fOwner") : $("fDue")).focus();
      return;
    }
    const existing = actions.find(a => a.owner.trim().toLowerCase() === owner.toLowerCase());
    const btn = $("addBtn");
    btn.disabled = true; btn.textContent = "Adding…";
    const { data, error } = await db.from("actions").insert({ title, owner: existing ? existing.owner.trim() : owner, due }).select().single();
    btn.disabled = false; btn.textContent = "Add action";
    if (error) { $("formMsg").textContent = "Couldn't add the action: " + error.message; return; }
    actions.push(fromRow(data));
    $("formMsg").textContent = "";
    $("fTitle").value = "";
    $("fTitle").focus();
    render();
  });

  $("clearEx").addEventListener("click", async () => {
    actions = actions.filter(a => !a.example);
    render();
    await run(db.from("actions").delete().eq("is_example", true), "Couldn't remove the examples.");
  });

  $("refreshBtn").addEventListener("click", fetchAll);

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    try { localStorage.setItem(FKEY, filter); } catch (e) {}
    render();
  }));

  // Keep the list fresh when teammates make changes
  document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchAll(); });
  setInterval(() => { if (!document.hidden) fetchAll(); }, 30000);

  render();
  fetchAll();
})();
</script>
</body>
</html>
